<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediQR - Edit Medical Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header>

    <div class="logo">
        MediQR
    </div>

    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/register">My Medical Profile</a>
    </nav>

</header>


<main class="registration-container">

    <div class="registration-card">

        <h1>Edit Medical Profile</h1>

        <p class="form-description">
            Update your personal medical information to keep your
            MediQR profile accurate and up to date.
        </p>


        <form id="editPatientForm">

            <input
                type="hidden"
                id="patient_id"
                value="{{ patient['patient_id'] }}"
            >


            <div class="form-group">

                <label for="name">
                    Full Name *
                </label>

                <input
                    type="text"
                    id="name"
                    value="{{ patient['name'] }}"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="age">
                        Age *
                    </label>

                    <input
                        type="number"
                        id="age"
                        value="{{ patient['age'] }}"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="gender">
                        Gender *
                    </label>

                    <select id="gender" required>

                        <option value="">
                            Select gender
                        </option>

                        <option
                            value="Male"
                            {% if patient['gender'] == 'Male' %}selected{% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if patient['gender'] == 'Female' %}selected{% endif %}
                        >
                            Female
                        </option>

                        <option
                            value="Other"
                            {% if patient['gender'] == 'Other' %}selected{% endif %}
                        >
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="blood_group">
                    Blood Group *
                </label>

                <select id="blood_group" required>

                    <option value="">
                        Select blood group
                    </option>

                    <option value="A+" {% if patient['blood_group'] == 'A+' %}selected{% endif %}>
                        A+
                    </option>

                    <option value="A-" {% if patient['blood_group'] == 'A-' %}selected{% endif %}>
                        A-
                    </option>

                    <option value="B+" {% if patient['blood_group'] == 'B+' %}selected{% endif %}>
                        B+
                    </option>

                    <option value="B-" {% if patient['blood_group'] == 'B-' %}selected{% endif %}>
                        B-
                    </option>

                    <option value="AB+" {% if patient['blood_group'] == 'AB+' %}selected{% endif %}>
                        AB+
                    </option>

                    <option value="AB-" {% if patient['blood_group'] == 'AB-' %}selected{% endif %}>
                        AB-
                    </option>

                    <option value="O+" {% if patient['blood_group'] == 'O+' %}selected{% endif %}>
                        O+
                    </option>

                    <option value="O-" {% if patient['blood_group'] == 'O-' %}selected{% endif %}>
                        O-
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="allergies">
                    Allergies
                </label>

                <textarea
                    id="allergies"
                    rows="3"
                >{{ patient['allergies'] }}</textarea>

            </div>


            <div class="form-group">

                <label for="medical_conditions">
                    Medical Conditions
                </label>

                <textarea
                    id="medical_conditions"
                    rows="3"
                >{{ patient['medical_conditions'] }}</textarea>

            </div>


            <div class="form-group">

                <label for="medications">
                    Current Medications
                </label>

                <textarea
                    id="medications"
                    rows="3"
                >{{ patient['medications'] }}</textarea>

            </div>


            <div class="form-group">

                <label for="emergency_contact">
                    Emergency Contact *
                </label>

                <input
                    type="tel"
                    id="emergency_contact"
                    value="{{ patient['emergency_contact'] }}"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Save Changes
            </button>


            <p id="editMessage"></p>


            <div class="patient-actions">

                <a
                    href="/patient/{{ patient['patient_id'] }}"
                    class="btn secondary-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
