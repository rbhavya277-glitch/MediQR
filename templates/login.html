<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediQR - Staff Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>

        <div class="logo">
            MediQR
        </div>

        <nav>
            <a href="/">Home</a>
        </nav>

    </header>


    <main class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>

<p class="login-description">
    Login to access your MediQR profile and QR code.
</p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>

        </div>

    </main>


    <footer>

        <p>
            © 2026 MediQR. All rights reserved.
        </p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
